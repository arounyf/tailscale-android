name: Android CI

on:
  push:
    branches:
      - main
      - "release-branch/*"
  pull_request:
    # all PRs on all branches

jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      # The checks below run before the APK is built, so a failure here would
      # skip the build entirely and cost us the artifact. They are quality
      # gates, not delivery gates, so let them fail without blocking the APK.
      - name: Format check (ktfmt)
        continue-on-error: true
        run: make fmt-check

      - name: Run Go tests
        continue-on-error: true
        run: make go-test

      - name: Build APKs
        run: make tailscale-debug.apk

      # Placed directly after the build so that a failure in the steps below
      # cannot swallow the APK. if-no-files-found: error keeps a missing
      # artifact loud instead of reporting a green run with nothing in it.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug-apk
          path: "**/tailscale-debug.apk"
          if-no-files-found: error

      - name: Run tests
        run: make test

      - name: Run release lint
        run: make release-lint
